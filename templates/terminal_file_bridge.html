<div class="modal" id="terminalFileModal" role="dialog" aria-modal="true" aria-labelledby="terminalFileTitle" aria-hidden="true">
    <div class="modal-content terminal-file-content">
        <div class="modal-header">
            <h2 id="terminalFileTitle">Open folder in Files</h2>
            <button type="button" class="close material-icons" data-close-terminal-file aria-label="Close" data-i18n-aria-label="common.close">close</button>
        </div>
        <form id="terminalFileForm">
            <div class="modal-body">
                <div class="terminal-file-target"><span data-i18n="terminalFiles.target">Target session</span><strong id="terminalFileTarget"></strong></div>
                <label for="terminalFilePath" data-i18n="terminalFiles.folderPath">Absolute folder path</label>
                <input class="form-control" id="terminalFilePath" type="text" maxlength="4096" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="terminalFileHint terminalFileError">
                <p id="terminalFileHint" class="terminal-file-hint"></p>
                <pre id="terminalFilePreview" aria-label="Text to insert" data-i18n-aria-label="terminalFiles.preview" hidden></pre>
                <p id="terminalFileError" role="status" aria-live="polite"></p>
                <button type="button" class="btn btn-secondary" id="terminalFileConnect" data-i18n="terminalFiles.connect" hidden>Open connections</button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-terminal-file data-i18n="common.cancel">Cancel</button>
                <button type="submit" class="btn btn-primary" id="terminalFileSubmit">Open folder in Files</button>
            </div>
        </form>
    </div>
</div>
